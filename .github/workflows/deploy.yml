name: CI/CD pipeline to depoy web application

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build docker image
        run: docker build -t nginx .

      - name: Tag docker image 
        run: |
          docker tag nginx ${{ secrets.DOCKER_USERNAME }}/nginx:latest
          docker tag nginx ${{ secrets.DOCKER_USERNAME }}/nginx:${{ github.sha }}

      - name: Push docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/nginx:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/nginx:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and deploy web app
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/nginx:${{ github.sha }}

            docker stop nginx || true
            docker rm nginx || true

          docker run -d --name web-app -p 8080:80 ${{ secrets.DOCKER_USERNAME }}/nginx:${{ github.sha }}
            docker ps

